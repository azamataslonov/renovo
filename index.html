<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>iTeach · Moliya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --bg:#F4F5F8; --card:#FFFFFF; --line:#E7E9EF;
    --ink:#141824; --muted:#6B7280; --faint:#9AA1AE;
    --brand:#25324F;        /* deep slate-navy */
    --accent:#4562F0;       /* indigo action  */
    --accent-soft:#EDF0FE;
    --expense:#E14B4B;      /* red   */
    --expense-soft:#FCEDED;
    --income:#1FA971;       /* emerald */
    --income-soft:#E7F6EF;
    --plan:#E39A2B;         /* amber */
    --plan-soft:#FBF1DF;
    --radius:16px;
    --shadow:0 1px 2px rgba(20,24,36,.04), 0 8px 24px rgba(20,24,36,.05);
    --shadow-sm:0 1px 2px rgba(20,24,36,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select{font-family:inherit}
  .num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#d4d7e0;border-radius:6px}

  /* ---------- LOGIN ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 600px at 20% -10%, #33436B 0%, #25324F 45%, #1C2740 100%);padding:24px}
  .login-card{width:100%;max-width:390px;background:var(--card);border-radius:22px;
    padding:36px 30px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
  .login-logo{display:flex;align-items:center;gap:11px;margin-bottom:26px}
  .login-mark{width:42px;height:42px;border-radius:12px;background:var(--brand);color:#fff;
    display:grid;place-items:center;font-weight:800;font-size:18px}
  .login-mark span{color:#7FE0C0}
  .login-card h1{font-size:20px;margin:0;font-weight:700}
  .login-card p.sub{margin:2px 0 0;color:var(--muted);font-size:13px}
  .field{margin-top:16px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .field input{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;
    padding:0 14px;font-size:15px;outline:none;transition:.15s;background:#fff}
  .field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .btn{height:46px;width:100%;border-radius:12px;background:var(--accent);color:#fff;
    font-weight:600;font-size:15px;margin-top:22px;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn:hover{filter:brightness(1.06)}
  .btn:active{transform:translateY(1px)}
  .login-err{background:var(--expense-soft);color:var(--expense);font-size:13px;
    padding:9px 12px;border-radius:10px;margin-top:16px;font-weight:500}
  .login-hint{margin-top:18px;font-size:12px;color:var(--faint);text-align:center;line-height:1.5}

  /* ---------- SHELL ---------- */
  .shell{display:flex;min-height:100vh}
  .side{width:240px;background:var(--brand);color:#C7CEDE;flex-shrink:0;
    position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px}
  .side-logo{display:flex;align-items:center;gap:10px;padding:6px 8px 22px}
  .side-logo .m{width:36px;height:36px;border-radius:10px;background:#fff;color:var(--brand);
    display:grid;place-items:center;font-weight:800;font-size:16px}
  .side-logo .m span{color:#1FA971}
  .side-logo b{color:#fff;font-size:16px;font-weight:700}
  .side-logo small{display:block;color:#8B95AC;font-size:11px;font-weight:500}
  .nav{display:flex;flex-direction:column;gap:3px;margin-top:6px}
  .nav button{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;
    color:#C7CEDE;font-size:14px;font-weight:500;width:100%;text-align:left;transition:.13s}
  .nav button .ic{width:19px;height:19px;flex-shrink:0;opacity:.85}
  .nav button:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav button.on{background:var(--accent);color:#fff}
  .nav button.on .ic{opacity:1}
  .side-foot{margin-top:auto;padding:8px}
  .side-foot .cloud{font-size:11px;color:#8B95AC;padding:8px 10px;border-radius:9px;
    background:rgba(255,255,255,.04);display:flex;align-items:center;gap:7px;margin-bottom:8px}
  .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .logout{color:#B9C1D4;font-size:13px;padding:9px 12px;border-radius:10px;width:100%;
    text-align:left;display:flex;gap:10px;align-items:center}
  .logout:hover{background:rgba(255,255,255,.06);color:#fff}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(244,245,248,.85);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    padding:14px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .topbar h2{margin:0;font-size:19px;font-weight:700}
  .topbar .month{font-size:12.5px;color:var(--muted);margin-top:1px}
  .add-btn{height:42px;padding:0 18px;border-radius:11px;background:var(--accent);color:#fff;
    font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-sm)}
  .add-btn:hover{filter:brightness(1.06)}
  .content{padding:24px 26px 60px;max-width:1180px;width:100%;margin:0 auto}

  /* ---------- CARDS ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .grid{display:grid;gap:16px}
  .hero{background:linear-gradient(120deg,#25324F,#33436B);color:#fff;border-radius:20px;
    padding:24px 26px;box-shadow:0 12px 30px rgba(37,50,79,.28);position:relative;overflow:hidden}
  .hero:after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;
    background:radial-gradient(circle,rgba(127,224,192,.22),transparent 70%);border-radius:50%}
  .hero .lbl{font-size:13px;color:#AEB8CE;font-weight:500}
  .hero .big{font-size:38px;font-weight:800;margin:6px 0 2px;letter-spacing:-.02em}
  .hero .big.neg{color:#FF9B9B}
  .hero .row{display:flex;gap:26px;margin-top:18px;flex-wrap:wrap}
  .hero .row .k{font-size:12px;color:#AEB8CE}
  .hero .row .v{font-size:16px;font-weight:700;margin-top:2px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px;box-shadow:var(--shadow-sm)}
  .kpi .t{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:7px}
  .kpi .n{font-size:22px;font-weight:800;margin-top:9px;letter-spacing:-.02em}
  .kpi .s{font-size:11.5px;color:var(--faint);margin-top:3px}
  .pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}

  .sec-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.04em;margin:26px 2px 12px}
  .two{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}

  .card-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;
    align-items:center;justify-content:space-between}
  .card-h h3{margin:0;font-size:15px;font-weight:700}
  .card-b{padding:16px 18px}

  /* table */
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11.5px;color:var(--faint);font-weight:600;text-transform:uppercase;
    letter-spacing:.03em;padding:10px 12px;border-bottom:1px solid var(--line)}
  td{padding:12px;border-bottom:1px solid #F0F1F5;font-size:13.5px;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#FAFBFD}
  .tag{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:7px;display:inline-block;white-space:nowrap}
  .amt{font-weight:700;color:var(--expense);white-space:nowrap}
  .del{color:var(--faint);font-size:16px;padding:4px 8px;border-radius:7px}
  .del:hover{background:var(--expense-soft);color:var(--expense)}

  /* progress */
  .prog{height:8px;border-radius:6px;background:#EEF0F5;overflow:hidden}
  .prog>i{display:block;height:100%;border-radius:6px;background:var(--income);transition:width .4s}
  .prog>i.over{background:var(--expense)}

  /* filters */
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .filters select,.filters input{height:40px;border:1.5px solid var(--line);border-radius:11px;
    padding:0 12px;font-size:13.5px;background:#fff;outline:none;color:var(--ink)}
  .filters select:focus,.filters input:focus{border-color:var(--accent)}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(20,24,36,.5);backdrop-filter:blur(3px);
    z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0}
  @media(min-width:640px){.overlay{align-items:center;padding:20px}}
  .modal{background:#fff;width:100%;max-width:460px;border-radius:22px 22px 0 0;padding:22px;
    max-height:92vh;overflow:auto;animation:up .25s ease}
  @media(min-width:640px){.modal{border-radius:20px}}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  .modal h3{margin:0 0 4px;font-size:18px;font-weight:700}
  .modal .msub{color:var(--muted);font-size:13px;margin:0 0 18px}
  .modal label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:14px 0 6px}
  .modal input,.modal select,.modal textarea{width:100%;height:46px;border:1.5px solid var(--line);
    border-radius:12px;padding:0 13px;font-size:15px;outline:none;background:#fff;color:var(--ink)}
  .modal textarea{height:auto;padding:11px 13px;min-height:62px;resize:vertical}
  .modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .modal .g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .m-actions{display:flex;gap:10px;margin-top:22px}
  .m-actions .ghost{flex:1;height:46px;border-radius:12px;background:#F1F2F6;color:var(--ink);font-weight:600}
  .m-actions .go{flex:1.4;height:46px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600}
  .amt-preview{font-size:26px;font-weight:800;text-align:center;padding:6px 0 2px;color:var(--expense)}

  .empty{text-align:center;padding:46px 20px;color:var(--faint)}
  .empty .e-ic{font-size:34px;margin-bottom:10px}

  /* mobile bottom nav */
  .mnav{display:none}
  @media(max-width:880px){
    .side{display:none}
    .content{padding:18px 14px 90px}
    .topbar{padding:12px 16px}
    .two{grid-template-columns:1fr}
    .kpis{grid-template-columns:1fr 1fr}
    .hero .big{font-size:32px}
    .mnav{display:flex;position:fixed;bottom:12px;left:12px;right:12px;z-index:60;
      background:var(--brand);border-radius:18px;padding:7px;justify-content:space-around;
      box-shadow:0 10px 30px rgba(37,50,79,.4)}
    .mnav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:#98A2BC;
      font-size:10px;font-weight:600;padding:6px 8px;border-radius:12px;flex:1}
    .mnav button.on{color:#fff;background:rgba(255,255,255,.12)}
    .mnav .ic{width:20px;height:20px}
    .fab{position:fixed;right:18px;bottom:82px;z-index:61;width:56px;height:56px;border-radius:50%;
      background:var(--accent);color:#fff;font-size:26px;display:grid;place-items:center;
      box-shadow:0 10px 26px rgba(69,98,240,.5)}
  }
  @media(max-width:420px){.kpis{grid-template-columns:1fr 1fr;gap:10px}}
</style>
</head>

<script type="text/babel" data-presets="react">
const {useState,useEffect,useMemo,useRef} = React;

/* ---------------- constants ---------------- */
const DEPTS = ["Savdo bo'limi","Marketing bo'limi","O'quv bo'limi","Sifat nazorati","Moliya bo'limi","IT bo'limi","Ofis xarajat","Tug'ilgan kuni","Boshqaruv","Yangi product","E'lonlar"];
const TYPES = ["Oylik","Bonus","Target","Video","Soliq","Ijara","Tozalik","Komunal","Internet","Sms","Bloger","Vozvrat","Investitsion"];
const DEPT_COLORS = {
  "Savdo bo'limi":"#4562F0","Marketing bo'limi":"#E39A2B","O'quv bo'limi":"#1FA971",
  "IT bo'limi":"#7B61FF","Boshqaruv":"#25324F","Ofis xarajat":"#00B3B0",
  "Yangi product":"#E14B4B","E'lonlar":"#F06595","Tug'ilgan kuni":"#F783AC",
  "Moliya bo'limi":"#748FFC","Sifat nazorati":"#94D82D"
};
const dColor = d => DEPT_COLORS[d] || "#9AA1AE";

const DEFAULT_PW = "iteach";
const DEFAULT_USER = "admin";
const DEFAULT_BALANCE = 150000000;

/* ================================================================
   BULUTGA ULANISH (ixtiyoriy — hamma qurilmada avtomatik ulanish)
   Quyidagi 2 qatorni to'ldirsangiz, saytga qaysi qurilmadan kirsangiz
   ham bir xil ma'lumot ko'rinadi. To'ldirmasangiz — Sozlamalar orqali
   ham kiritish mumkin. Qanday olish → SETUP.md
   ================================================================ */
const CLOUD = {
  binId:  "",   // masalan: "665f0a1e2b3c..."
  apiKey: ""    // JSONBin Access/Master Key
};

/* ---------------- JSONBin bulut ---------------- */
const JB = {
  base:"https://api.jsonbin.io/v3/b",
  cfg(c){ return { binId:(c&&c.binId)||CLOUD.binId, apiKey:(c&&c.apiKey)||CLOUD.apiKey }; },
  on(c){ const x=JB.cfg(c); return !!(x.binId && x.apiKey); },
  async read(c){
    const {binId,apiKey}=JB.cfg(c);
    const r=await fetch(JB.base+"/"+binId+"/latest",{headers:{"X-Master-Key":apiKey,"X-Bin-Meta":"false"}});
    if(!r.ok) throw new Error("read "+r.status);
    return await r.json(); // returns record object directly (meta off)
  },
  async write(c,record){
    const {binId,apiKey}=JB.cfg(c);
    const r=await fetch(JB.base+"/"+binId,{method:"PUT",
      headers:{"Content-Type":"application/json","X-Master-Key":apiKey},body:JSON.stringify(record)});
    if(!r.ok) throw new Error("write "+r.status);
    return true;
  }
};

/* ---------------- helpers ---------------- */
const fmt = n => Math.round(n||0).toLocaleString('ru-RU').replace(/\u00a0/g,' ');
const som = n => fmt(n)+" so'm";
const short = n => {
  n = n||0; const a=Math.abs(n);
  if(a>=1e9) return (n/1e9).toFixed(1).replace(/\.0$/,'')+" mlrd";
  if(a>=1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'')+" mln";
  if(a>=1e3) return Math.round(n/1e3)+" ming";
  return fmt(n);
};
const todayStr = () => { const d=new Date(); return d.toISOString().slice(0,10); };
const uid = () => Date.now()+Math.floor(Math.random()*1000);
const parseSeed = id => { try{return JSON.parse(document.getElementById(id).textContent)}catch(e){return[]} };

/* localStorage safe wrappers */
const LS = {
  get(k){ try{const v=localStorage.getItem(k); return v?JSON.parse(v):null}catch(e){return null} },
  set(k,v){ try{localStorage.setItem(k,JSON.stringify(v))}catch(e){} }
};

/* ---------------- icons (inline svg) ---------------- */
const Ic = ({d,size=19}) => (
  <svg className="ic" width={size} height={size} viewBox="0 0 24 24" fill="none"
    stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{d}</svg>
);

  gear:<><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.3 1a7 7 0 0 0-1.7-1l-.3-2.5H9.4l-.3 2.5a7 7 0 0 0-1.7 1l-2.3-1-2 3.4L5 11a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 1.7 1l.3 2.5h4.2l.3-2.5a7 7 0 0 0 1.7-1l2.3 1 2-3.4-2-1.5a7 7 0 0 0 .1-1Z"/></>,
  out:<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></>,
  plus:<><path d="M12 5v14M5 12h14"/></>,
};

/* ================= LOGIN ================= */
function Login({onOk,cfg,setCfg}){
  const [u,setU]=useState(cfg.user||"admin"); const [p,setP]=useState("");
  const [err,setErr]=useState(""); const [busy,setBusy]=useState(false);
  const [showCloud,setShowCloud]=useState(false);
  const [binId,setBinId]=useState(cfg.binId||""); const [apiKey,setApiKey]=useState(cfg.apiKey||"");
  const cloudReady = !!((binId||CLOUD.binId)&&(apiKey||CLOUD.apiKey));

  const submit = async () => {
    setErr("");
    const c={...cfg,binId:binId.trim(),apiKey:apiKey.trim()};
    if(JB.on(c)){
      setBusy(true);
      try{
        const rec = await JB.read(c);
        const auth = (rec&&rec.auth) || {user:DEFAULT_USER,pw:DEFAULT_PW};
        setBusy(false);
        if(u.trim()===auth.user && p===auth.pw){
          setCfg(x=>({...x,binId:c.binId,apiKey:c.apiKey,user:auth.user,pw:auth.pw}));
          onOk(rec);
        } else setErr("Login yoki parol xato.");
      }catch(e){ setBusy(false); setErr("Bulutga ulanib bo'lmadi. Bin ID va kalitni tekshiring."); }
      return;
    }
    // demo/local
    if(u.trim()===cfg.user && p===cfg.pw){ onOk(null); }
    else setErr("Login yoki parol xato.");
  };

  return (
    <div className="login-wrap">
      <div className="login-card">
        <div className="login-logo">
          <div className="login-mark">i<span>T</span></div>
          <div><h1>iTeach Moliya</h1><p className="sub">Xarajat va balans boshqaruvi</p></div>
        </div>
        <div className="field"><label>Login</label>
          <input value={u} onChange={e=>setU(e.target.value)} placeholder="admin"
            onKeyDown={e=>e.key==='Enter'&&submit()} autoCapitalize="none"/></div>
        <div className="field"><label>Parol</label>
          <input type="password" value={p} onChange={e=>setP(e.target.value)} placeholder="••••••"
            onKeyDown={e=>e.key==='Enter'&&submit()}/></div>

        {!CLOUD.binId && (
          <div style={{marginTop:14}}>
            <button onClick={()=>setShowCloud(s=>!s)} style={{fontSize:12.5,color:'var(--accent)',fontWeight:600}}>
              {showCloud?"▲ Bulutga ulanishni yashirish":"▼ Bulutga ulanish (barcha qurilma uchun)"}
            </button>
            {showCloud && (
              <div style={{marginTop:10,padding:'12px',background:'#F7F8FB',borderRadius:12}}>
                <div className="field" style={{marginTop:0}}><label>Bin ID</label>
                  <input value={binId} onChange={e=>setBinId(e.target.value)} placeholder="JSONBin Bin ID"/></div>
                <div className="field"><label>API kalit</label>
                  <input value={apiKey} onChange={e=>setApiKey(e.target.value)} placeholder="X-Master/Access Key"/></div>
                <p style={{fontSize:11.5,color:'var(--faint)',margin:'8px 2px 0'}}>Bir marta kiritiladi. Qanday olish → SETUP.md</p>
              </div>
            )}
          </div>
        )}

        {err && <div className="login-err">{err}</div>}
        <button className="btn" onClick={submit} disabled={busy}>{busy?"Tekshirilmoqda…":"Kirish"}</button>
        <div className="login-hint">{cloudReady?"☁ Bulutga ulangan · barcha qurilmada bir xil":"Demo rejim · login: admin · parol: iteach"}</div>
      </div>
    </div>
  );
}

/* ================= CHARTS ================= */
function Donut({data,total}){
  // data: [{label,value,color}]
  const R=54, C=2*Math.PI*R; let off=0;
  const segs = data.filter(d=>d.value>0);
  return (
    <div style={{display:'flex',alignItems:'center',gap:18,flexWrap:'wrap'}}>
      <svg width="140" height="140" viewBox="0 0 140 140" style={{flexShrink:0}}>
        <g transform="rotate(-90 70 70)">
          <circle cx="70" cy="70" r={R} fill="none" stroke="#EEF0F5" strokeWidth="18"/>
          {segs.map((d,i)=>{
            const len=C*(d.value/total); const el=<circle key={i} cx="70" cy="70" r={R} fill="none"
              stroke={d.color} strokeWidth="18" strokeDasharray={len+" "+(C-len)}
              strokeDashoffset={-off} strokeLinecap="butt"/>; off+=len; return el;
          })}
        </g>
        <text x="70" y="66" textAnchor="middle" fontSize="11" fill="#9AA1AE" fontWeight="600">JAMI</text>
        <text x="70" y="83" textAnchor="middle" fontSize="15" fill="#141824" fontWeight="800">{short(total)}</text>
      </svg>
      <div style={{flex:1,minWidth:150,display:'flex',flexDirection:'column',gap:7}}>
        {segs.slice(0,6).map((d,i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',gap:8,fontSize:12.5}}>
            <span style={{width:10,height:10,borderRadius:3,background:d.color,flexShrink:0}}></span>
            <span style={{color:'#6B7280',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{d.label}</span>
            <b className="num" style={{fontSize:12.5}}>{short(d.value)}</b>
          </div>
        ))}
      </div>
    </div>
  );
}
function MiniBars({data}){
  const max = Math.max(1,...data.map(d=>d.value));
  return (
    <div style={{display:'flex',alignItems:'flex-end',gap:5,height:90,padding:'4px 0'}}>
      {data.map((d,i)=>(
        <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:5}}>
          <div title={som(d.value)} style={{width:'100%',maxWidth:26,height:Math.max(3,(d.value/max)*72),
            background:'linear-gradient(180deg,#5B77F5,#4562F0)',borderRadius:'5px 5px 2px 2px'}}></div>
          <span style={{fontSize:9.5,color:'#9AA1AE'}}>{d.label}</span>
        </div>
      ))}
    </div>
  );
}

/* ================= APP ================= */
function App(){
  const [cfg,setCfg] = useState(()=>({user:DEFAULT_USER,pw:DEFAULT_PW,binId:"",apiKey:"",balanceStart:DEFAULT_BALANCE, ...(LS.get('iteach_cfg')||{})}));
  const [authed,setAuthed] = useState(false);
  const [tab,setTab] = useState('home');
  const [emp,setEmp] = useState(()=>LS.get('iteach_emp')||parseSeed('seed-emp'));
  const [exp,setExp] = useState(()=>LS.get('iteach_exp')||parseSeed('seed-daily'));
  const [opex,setOpex] = useState(()=>LS.get('iteach_opex')||parseSeed('seed-opex'));
  const [cash,setCash] = useState(()=>LS.get('iteach_cash')||{bank:0,card:0,uzum:0,open:0,variant:0});

  useEffect(()=>LS.set('iteach_cfg',cfg),[cfg]);

  useEffect(()=>LS.set('iteach_exp',exp),[exp]);
  useEffect(()=>LS.set('iteach_opex',opex),[opex]);
  useEffect(()=>LS.set('iteach_cash',cash),[cash]);

  const cloudOn = JB.on(cfg);

  // cloud save (debounced) — writes whole record to the bin
  const saveTimer = useRef(null);
  useEffect(()=>{
    if(!authed || !cloudOn) return;
    clearTimeout(saveTimer.current);
    setSyncing(true);
    saveTimer.current = setTimeout(async()=>{
      const record={ auth:{user:cfg.user,pw:cfg.pw},
        state:{emp,exp,opex,cash,balanceStart:cfg.balanceStart} };
      try{ await JB.write(cfg,record); }catch(e){}
      setSyncing(false);
    },900);
  },[emp,exp,opex,cash,cfg.balanceStart,cfg.user,cfg.pw]);

  // called by Login; rec = bin record (or null in demo)
  const afterLogin = async (rec) => {
    setAuthed(true);
    if(rec && rec.state){
      const d=rec.state;
      if(Array.isArray(d.emp)&&d.emp.length) setEmp(d.emp);
      if(Array.isArray(d.exp)) setExp(d.exp);
      if(Array.isArray(d.opex)&&d.opex.length) setOpex(d.opex);

      if(typeof d.balanceStart==='number') setCfg(c=>({...c,balanceStart:d.balanceStart}));

  };

  /* --------- derived --------- */

    const m={}; exp.forEach(e=>{const k=e.dept||"Boshqa"; m[k]=(m[k]||0)+(+e.amount||0)}); return m;
  },[exp]);
  const spentByType = useMemo(()=>{
    const m={}; exp.forEach(e=>{const k=e.type||"Boshqa"; m[k]=(m[k]||0)+(+e.amount||0)}); return m;
  },[exp]);
  // payroll computed: paid = base + linked expenses(empName)
  const empRows = useMemo(()=>{
    const linked={}; exp.forEach(e=>{ if(e.empName){linked[e.empName]=(linked[e.empName]||0)+(+e.amount||0)} });
    return emp.map(m=>{
      const paid=(+m.paid||0)+(linked[m.name]||0);
      const rem=Math.max(0,(+m.fullSalary||0)-paid);
      return {...m,paidCalc:paid,rem};
    });
  },[emp,exp]);
  const salaryTotals = useMemo(()=>{
    let full=0,paid=0; empRows.forEach(m=>{full+=(+m.fullSalary||0);paid+=m.paidCalc}); 
    return {full,paid,rem:Math.max(0,full-paid)};
  },[empRows]);

  /* --------- actions --------- */
  const addExpense = (o) => {
    setExp(p=>[{id:uid(),...o},...p]);
  };
  const delExpense = (id) => setExp(p=>p.filter(e=>e.id!==id));
  const payEmployee = (name,amount,date,note) => {
    addExpense({date,dept:emp.find(e=>e.name===name)?.dept||"",type:"Oylik",amount:+amount,note:note||("Oylik: "+name),empName:name});
  };

  if(!authed) return <Login onOk={afterLogin} cfg={cfg} setCfg={setCfg}/>;

  const monthLabel = "Iyul 2026";
  const NAV=[
    {k:'home',t:'Bosh sahifa',i:icons.home},
    {k:'exp',t:'Xarajatlar',i:icons.list},

    {k:'cash',t:'Cash Flow',i:icons.cash},
    {k:'set',t:'Sozlamalar',i:icons.gear},

  const MNAV=[NAV[0],NAV[1],NAV[2],NAV[4],NAV[6]];

  return (

      {/* sidebar */}

          <div><b>iTeach</b><small>Moliya paneli</small></div>
        </div>

/* ============ OVERVIEW ============ */

        <div className="kpi"><div className="t"><span className="dot" style={{background:'var(--income)'}}></span>Qolgan balans</div>
          <div className="n num" style={{color:balance<0?'var(--expense)':'var(--income)'}}>{short(balance)}</div>
          <div className="s">boshlang'ichdan</div></div>
        <div className="kpi"><div className="t"><span className="dot" style={{background:'var(--plan)'}}></span>Oylik qoldiq</div>

          <div className="card-h"><h3>Kunlik xarajatlar</h3></div>

/* ============ OPEX (plan/fakt) ============ */
function Opex({opex,setOpex}){
  const tPlan=opex.reduce((s,o)=>s+o.plan,0), tFakt=opex.reduce((s,o)=>s+o.fakt,0);
  const setFakt=(i,v)=>setOpex(p=>p.map((o,idx)=>idx===i?{...o,fakt:+v||0}:o));
  const setPlan=(i,v)=>setOpex(p=>p.map((o,idx)=>idx===i?{...o,plan:+v||0}:o));
  return (
    <>
      <div className="kpis" style={{marginTop:0}}>
        <div className="kpi"><div className="t">Jami reja (Plan)</div><div className="n num">{short(tPlan)}</div></div>
        <div className="kpi"><div className="t">Jami fakt</div><div className="n num" style={{color:'var(--expense)'}}>{short(tFakt)}</div></div>
        <div className="kpi"><div className="t">Farq (qoldiq)</div><div className="n num" style={{color:'var(--income)'}}>{short(tPlan-tFakt)}</div></div>
        <div className="kpi"><div className="t">Bajarilish</div><div className="n num">{tPlan?Math.round(tFakt/tPlan*100):0}%</div></div>
      </div>
      <div className="card" style={{marginTop:16}}>
        <div className="card-h"><h3>Byudjet — Plan / Fakt</h3><span style={{fontSize:12,color:'var(--faint)'}}>raqamlarni tahrirlash mumkin</span></div>
        <div style={{overflowX:'auto'}}>
          <table>
            <thead><tr><th>Kategoriya</th><th style={{textAlign:'right'}}>Plan</th><th style={{textAlign:'right'}}>Fakt</th><th style={{minWidth:120}}>Bajarilish</th></tr></thead>
            <tbody>
              {opex.map((o,i)=>{
                const pct=o.plan?Math.min(100,Math.round(o.fakt/o.plan*100)):(o.fakt>0?100:0);
                const over=o.plan&&o.fakt>o.plan;
                return (
                  <tr key={i}>
                    <td><b style={{fontWeight:600}}>{o.name}</b></td>
                    <td style={{textAlign:'right'}}>
                      <input className="num" value={o.plan} onChange={e=>setPlan(i,e.target.value)}
                        style={{width:120,height:34,border:'1px solid var(--line)',borderRadius:8,textAlign:'right',padding:'0 8px',fontSize:13}}/>
                    </td>
                    <td style={{textAlign:'right'}}>
                      <input className="num" value={o.fakt} onChange={e=>setFakt(i,e.target.value)}
                        style={{width:120,height:34,border:'1px solid var(--line)',borderRadius:8,textAlign:'right',padding:'0 8px',fontSize:13,color:'var(--expense)',fontWeight:600}}/>
                    </td>
                    <td>
                      <div style={{display:'flex',alignItems:'center',gap:8}}>
                        <div className="prog" style={{flex:1}}><i className={over?'over':''} style={{width:pct+'%'}}></i></div>
                        <span className="num" style={{fontSize:12,color:over?'var(--expense)':'var(--muted)',width:34,textAlign:'right'}}>{pct}%</span>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
            <tfoot><tr style={{fontWeight:700,background:'#FAFBFD'}}>
              <td style={{fontWeight:700}}>JAMI</td>
              <td className="num" style={{textAlign:'right',fontWeight:700}}>{fmt(tPlan)}</td>
              <td className="num" style={{textAlign:'right',fontWeight:700,color:'var(--expense)'}}>{fmt(tFakt)}</td>
              <td className="num" style={{color:'var(--muted)'}}>{tPlan?Math.round(tFakt/tPlan*100):0}%</td>
            </tr></tfoot>
          </table>
        </div>
      </div>
    </>
  );
}

          <table>

/* ============ CASHFLOW ============ */
function Cashflow({cash,setCash,balance,salaryTotals,opex}){
  const set=(k,v)=>setCash(p=>({...p,[k]:+v||0}));
  const currentCash=(+cash.bank||0)+(+cash.card||0);
  const expectedNasiya=(+cash.uzum||0)+(+cash.open||0)+(+cash.variant||0);
  const available=currentCash+expectedNasiya;
  const planned=salaryTotals.rem + opex.filter(o=>['Bino xarajatlari','Marketing xarajatlari','Boshqa doimiy'].includes(o.name)).reduce((s,o)=>s+Math.max(0,o.plan-o.fakt),0);
  const remaining=available-planned;
  const Row=({label,k})=>(
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,padding:'10px 0',borderBottom:'1px solid #F0F1F5'}}>
      <span style={{fontSize:13.5,color:'var(--muted)'}}>{label}</span>
      <input className="num" value={cash[k]} onChange={e=>set(k,e.target.value)}
        style={{width:150,height:38,border:'1.5px solid var(--line)',borderRadius:10,textAlign:'right',padding:'0 11px',fontSize:14,fontWeight:600}}/>
    </div>
  );
  return (
    <>
      <div className="two">
        <div className="card">
          <div className="card-h"><h3>Hozirgi mablag'</h3></div>
          <div className="card-b" style={{paddingTop:4}}>
            <Row label="Bank hisobidagi qoldiq" k="bank"/>
            <Row label="Kartadagi qoldiq" k="card"/>
            <Row label="Kutilayotgan Uzum nasiya" k="uzum"/>
            <Row label="Kutilayotgan Open nasiya" k="open"/>
            <Row label="Kutilayotgan Variant nasiya" k="variant"/>
          </div>
        </div>
        <div className="card" style={{display:'flex',flexDirection:'column'}}>
          <div className="card-h"><h3>Xulosa</h3></div>
          <div className="card-b" style={{flex:1,display:'flex',flexDirection:'column',gap:14,justifyContent:'center'}}>
            <Sum label="Joriy naqd (bank+karta)" v={currentCash}/>
            <Sum label="Kutilayotgan nasiya" v={expectedNasiya}/>
            <Sum label="Jami mavjud mablag'" v={available} strong/>
            <Sum label="Rejadagi xarajatlar" v={-planned} neg/>
            <div style={{borderTop:'2px solid var(--line)',paddingTop:14,marginTop:2}}>
              <Sum label="Xarajatdan keyin qoladi" v={remaining} big/>
            </div>
          </div>
        </div>
      </div>
      <div className="card" style={{marginTop:16,background:'linear-gradient(120deg,#25324F,#33436B)',color:'#fff',border:'none'}}>
        <div className="card-b" style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:12}}>
          <div><div style={{fontSize:13,color:'#AEB8CE'}}>Dashboard bo'yicha joriy balans</div>
            <div className="num" style={{fontSize:28,fontWeight:800}}>{som(balance)}</div></div>
          <div style={{fontSize:12,color:'#AEB8CE',maxWidth:280,textAlign:'right'}}>Har bir xarajat kiritilganda bu balans avtomatik kamayadi</div>
        </div>
      </div>
    </>
  );
}
function Sum({label,v,strong,neg,big}){
  return (
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
      <span style={{fontSize:big?14:13,color:'var(--muted)',fontWeight:big?600:400}}>{label}</span>
      <b className="num" style={{fontSize:big?24:strong?17:15,
        color:big?(v<0?'var(--expense)':'var(--income)'):neg?'var(--expense)':'var(--ink)',
        fontWeight:big||strong?800:600}}>{v<0?'−'+fmt(-v):fmt(v)}</b>
    </div>
  );
}

/* ============ SETTINGS ============ */
function Settings({cfg,setCfg,exp,emp,opex,cash}){
  const [f,setF]=useState(cfg);
  const [saved,setSaved]=useState(false);
  const [test,setTest]=useState('');
  const on=JB.on(f);
  const save=()=>{ setCfg(f); setSaved(true); setTimeout(()=>setSaved(false),1800); };
  const exportJson=()=>{
    const blob=new Blob([JSON.stringify({exp,emp,opex,cash,cfg},null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='iteach-moliya-'+todayStr()+'.json'; a.click();
  };
  return (
    <div style={{maxWidth:640}}>
      <div className="card">
        <div className="card-h"><h3>Boshlang'ich balans</h3></div>
        <div className="card-b">
          <label style={{fontSize:12.5,fontWeight:600,color:'var(--muted)'}}>Oy boshidagi balans (so'm)</label>
          <input className="num" value={f.balanceStart} onChange={e=>setF({...f,balanceStart:+e.target.value||0})}
            style={{width:'100%',height:46,border:'1.5px solid var(--line)',borderRadius:12,padding:'0 13px',fontSize:16,fontWeight:600,marginTop:6}}/>
          <p style={{fontSize:12.5,color:'var(--faint)',marginTop:8}}>Har bir xarajat shu summadan ayriladi. Hozir: {som(f.balanceStart)}</p>
        </div>
      </div>

      <div className="card" style={{marginTop:16}}>
        <div className="card-h"><h3>Kirish ma'lumotlari</h3></div>
        <div className="card-b">
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            <div><label style={{fontSize:12.5,fontWeight:600,color:'var(--muted)'}}>Login</label>
              <input value={f.user} onChange={e=>setF({...f,user:e.target.value})}
                style={{width:'100%',height:46,border:'1.5px solid var(--line)',borderRadius:12,padding:'0 13px',fontSize:15,marginTop:6}}/></div>
            <div><label style={{fontSize:12.5,fontWeight:600,color:'var(--muted)'}}>Parol</label>
              <input value={f.pw} onChange={e=>setF({...f,pw:e.target.value})}
                style={{width:'100%',height:46,border:'1.5px solid var(--line)',borderRadius:12,padding:'0 13px',fontSize:15,marginTop:6}}/></div>
          </div>
          <p style={{fontSize:12,color:'var(--faint)',marginTop:8}}>Bulutga ulanganda parol bulut (bin)da saqlanadi — barcha qurilmada bir xil parol.</p>
        </div>
      </div>

      <div className="card" style={{marginTop:16}}>
        <div className="card-h"><h3>Bulutga ulanish (barcha qurilma)</h3>
          <span className="pill" style={{background:on?'var(--income-soft)':'var(--plan-soft)',color:on?'var(--income)':'var(--plan)'}}>
            {on?'Ulangan':'Ulanmagan'}</span></div>
        <div className="card-b">
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            <div><label style={{fontSize:12.5,fontWeight:600,color:'var(--muted)'}}>Bin ID</label>
              <input value={f.binId||""} onChange={e=>setF({...f,binId:e.target.value.trim()})} placeholder="JSONBin Bin ID"
                style={{width:'100%',height:46,border:'1.5px solid var(--line)',borderRadius:12,padding:'0 13px',fontSize:14,marginTop:6}}/></div>
            <div><label style={{fontSize:12.5,fontWeight:600,color:'var(--muted)'}}>API kalit</label>
              <input value={f.apiKey||""} onChange={e=>setF({...f,apiKey:e.target.value.trim()})} placeholder="X-Master / Access Key"
                style={{width:'100%',height:46,border:'1.5px solid var(--line)',borderRadius:12,padding:'0 13px',fontSize:14,marginTop:6}}/></div>
          </div>
          <div style={{display:'flex',gap:10,marginTop:12,alignItems:'center',flexWrap:'wrap'}}>
            <button className="add-btn" style={{background:'#F1F2F6',color:'var(--ink)',height:38}}
              onClick={async()=>{ setTest('...'); try{ await JB.read(f); setTest('ok'); }catch(e){ setTest('err'); } }}>
              Ulanishni tekshirish</button>
            {test==='ok' && <span style={{color:'var(--income)',fontSize:13,fontWeight:600}}>✓ Ulandi</span>}
            {test==='err' && <span style={{color:'var(--expense)',fontSize:13,fontWeight:600}}>✕ Ulanmadi — ma'lumotni tekshiring</span>}
            {test==='...' && <span style={{color:'var(--muted)',fontSize:13}}>tekshirilmoqda…</span>}
          </div>
          <p style={{fontSize:12.5,color:'var(--faint)',marginTop:10,lineHeight:1.5}}>
            Bu ikki maydon to'ldirilsa — balans, xarajatlar, oyliklar Google'siz bulutda (JSONBin) saqlanadi va
            <b> istalgan qurilmadan</b> bir xil ko'rinadi. Google Sheets ishlatilmaydi. Olish yo'li → SETUP.md</p>
        </div>
      </div>

      <div style={{display:'flex',gap:10,marginTop:18,flexWrap:'wrap'}}>
        <button className="add-btn" onClick={save}>{saved?'✓ Saqlandi':'Saqlash'}</button>
        <button className="add-btn" style={{background:'#F1F2F6',color:'var(--ink)'}} onClick={exportJson}>Zaxira (JSON) yuklab olish</button>
      </div>
      <p style={{fontSize:12,color:'var(--faint)',marginTop:14,lineHeight:1.5}}>
        Sozlamalarni saqlagach chiqib qayta kiring — bulut ulanishi to'liq ishga tushadi.</p>
    </div>
  );
}

/* ============ MODAL (add expense / pay salary) ============ */
function Modal({modal,onClose,emp,addExpense,payEmployee}){
  const isPay = modal.type==='pay';
  const [date,setDate]=useState(todayStr());
  const [dept,setDept]=useState(isPay?(modal.emp.dept||''):DEPTS[0]);
  const [type,setType]=useState(isPay?'Oylik':'');
  const [amount,setAmount]=useState('');
  const [note,setNote]=useState('');
  const [empName,setEmpName]=useState(isPay?modal.emp.name:'');
  const amt=+amount||0;

  const submit=()=>{
    if(amt<=0) return;
    if(isPay){ payEmployee(modal.emp.name,amt,date,note); }
    else{ addExpense({date,dept,type,amount:amt,note,empName:empName||undefined}); }
    onClose();
  };
  const deptEmps = emp.filter(e=>e.dept===dept);

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h3>{isPay?"Oylik to'lash":"Yangi xarajat"}</h3>
        <p className="msub">{isPay?modal.emp.name+" · qolgan: "+som(modal.emp.rem):"Balansdan ayriladi"}</p>

        <div className="amt-preview num">{amt>0?'−'+som(amt):'0 so\'m'}</div>
        <label>Miqdor (so'm)</label>
        <input className="num" type="number" inputMode="numeric" value={amount} autoFocus
          onChange={e=>setAmount(e.target.value)} placeholder="0"/>

        <div className="g2">
          <div><label>Sana</label><input type="date" value={(!date||date==='None')?todayStr():date} onChange={e=>setDate(e.target.value)}/></div>
          <div><label>Tur</label>
            <select value={type} onChange={e=>setType(e.target.value)}>
              <option value="">—</option>{TYPES.map(t=><option key={t}>{t}</option>)}
            </select></div>
        </div>

        {!isPay && <>
          <label>Bo'lim</label>
          <select value={dept} onChange={e=>{setDept(e.target.value);setEmpName('')}}>
            {DEPTS.map(d=><option key={d}>{d}</option>)}
          </select>
          {deptEmps.length>0 && (
            <>
              <label>Xodim (ixtiyoriy — oylikka bog'lash)</label>
              <select value={empName} onChange={e=>setEmpName(e.target.value)}>
                <option value="">— bog'lanmasin —</option>
                {deptEmps.map(e=><option key={e.name}>{e.name}</option>)}
              </select>
            </>
          )}
        </>}

        <label>Izoh</label>
        <textarea value={note} onChange={e=>setNote(e.target.value)} placeholder="Masalan: avans, bonus…"/>

        <div className="m-actions">
          <button className="ghost" onClick={onClose}>Bekor</button>
          <button className="go" onClick={submit}>{isPay?"To'lovni saqlash":"Xarajatni qo'shish"}</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
